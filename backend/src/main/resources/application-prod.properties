spring.application.name=small-business-sales
server.port=${PORT:8080}

# Database (PostgreSQL if DATABASE_URL is set, H2 file fallback if pending)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/salescrm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security & JWT
jwt.secret=${JWT_SECRET:default-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-b2b-sales-crm}
jwt.expiration=86400000

# CORS
app.cors.frontend-url=${FRONTEND_URL:}

# AI Integration
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
