services:
  - type: web
    name: small-business-sales-backend
    env: java
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/small-business-sales-2.0.0.jar
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: DATABASE_URL
        fromDatabase:
          name: sales-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-1.5-flash

databases:
  - name: sales-manager-db
    plan: free
    databaseName: sales_manager
    user: sales_user
